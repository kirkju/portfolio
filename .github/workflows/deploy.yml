name: Build and deploy

# Construye el export estático y lo publica en el App Service existente (Windows/IIS).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: aledev
  NODE_VERSION: "24"

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # Se sube como zip: upload-artifact omite carpetas ocultas y el zip evita perder archivos.
      - name: Package static export
        run: cd out && zip -qr ../site.zip .

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site.zip
          retention-days: 7

  deploy:
    name: Deploy to Azure App Service
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site

      - name: Check publish profile secret
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "::error::Falta el secreto AZURE_WEBAPP_PUBLISH_PROFILE (ver README, sección Despliegue)."
            exit 1
          fi

      - name: Deploy
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: site.zip
          type: zip
          # Borra wwwroot antes de publicar (elimina los archivos del sitio anterior).
          clean: true
